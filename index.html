<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Samriddhi</title><link rel="stylesheet" href="./static/style.css"></head><body class="home">
<section id="intro" class="intro screen"><div class="party-burst" id="partyBurst"></div><div class="intro-title">Happy Birthday<br><span>Samriddhi</span><span class="moon">☾</span><span class="star">✦</span></div><img class="snoopy" src="./static/assets/snoopy_cake.png" alt="Snoopy holding a birthday cake"><div id="countdown" class="countdown" aria-live="polite"></div><div id="cakeMoment" class="cake-moment" aria-hidden="true"><div class="cake-count" id="cakeCount">3</div><img src="./static/assets/birthday_cake.png" alt="Birthday cake"><span class="blown-out" id="blownOut">✧</span></div><div class="hint-star">✧</div><img class="intro-spidey" src="./static/assets/spiderman_bouquet.png" alt="Spider-Man holding roses"><img class="intro-friends" src="./static/assets/cute_characters.png" alt="Cute birthday friends"></section>
<section id="main" class="main-screen screen hidden"><div class="main-title">Happy Birthday Samriddhi <span>✦</span></div><img class="character-sheet character-sheet-left" src="./static/assets/cute_characters.png" alt="Cute character stickers"><div class="scrapbook">

<div class="bouquet-side"><div class="click-cue">click <span class="curved-arrow">↷</span></div><button class="bouquet-button" id="bouquetButton" aria-label="Open love note"><img src="./static/assets/bouquet_character.png" alt="Cute character holding a bouquet"></button></div>
</div><div class="bottom-letters"><a class="letter-tile letter-tile-link" href="./letter.html"><img class="envelope-image" src="./static/assets/letter_envelope.png" alt="Cute sealed letter"><span>open me ♡</span></a></div></section>
